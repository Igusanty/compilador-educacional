<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compilador Educacional</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 80px auto; padding: 0 20px; color: #222; }
    h1 { margin-bottom: 8px; }
    #mensagem { font-size: 1.5rem; margin-top: 32px; }
  </style>
</head>
<body>
  <h1>Compilador Educacional</h1>
  <p>Projeto inicial para o estudo de conceitos de compiladores usando Python.</p>
  <p id="mensagem">Carregando mensagem do backend...</p>
  <script>
    fetch('/api/hello')
      .then(response => {
        if (!response.ok) throw new Error('Falha na resposta do backend');
        return response.json();
      })
      .then(data => { document.getElementById('mensagem').textContent = data.message; })
      .catch(() => { document.getElementById('mensagem').textContent = 'Erro ao conectar com o backend.'; });
  </script>
</body>
</html>
